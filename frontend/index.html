<!-- Define the document as an HTML5 document -->
<!doctype html>

<!-- Start the HTML document and set the page language to English -->
<html lang="en">
  <head>
    <!-- Set the character encoding to UTF-8 -->
    <meta charset="UTF-8" />

    <!-- Set the browser tab icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Make the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the title displayed in the browser tab -->
    <title>systemthinker-ai</title>
  </head>

  <!-- Define the page colors, transitions, and dark-mode styles -->
  <body class="bg-slate-50 text-slate-900 transition-colors duration-500 dark:bg-slate-950 dark:text-white">
    <!-- React renders the application inside this element -->
    <div id="root"></div>

    <!-- Load the main React application file as a JavaScript module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
